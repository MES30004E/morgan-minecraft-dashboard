plugins { id 'fabric-loom' version '1.9.2' }
version = '0.1.0'
group = 'community.morgan'
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.20.1'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
