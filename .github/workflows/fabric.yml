name: Fabric identity bridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle -p fabric test build --no-daemon --no-watch-fs
      - uses: actions/upload-artifact@v4
        with:
          name: morgan-identity-bridge
          path: fabric/build/libs/*.jar
          retention-days: 14
