name: Agent safety tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=agent python -m unittest discover -s agent/tests -v
